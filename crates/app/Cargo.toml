[package]
name = "shadowplayer"
version = "0.16.0"
edition = "2021"
license = "Apache-2.0"


[[bin]]
name = "shadowplayer"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
audio-session = { path = "../audio-session" }
database = { path = "../database" }
metadata = { path = "../metadata" }
library = { path = "../library" }
lyrics = { path = "../lyrics" }
search = { path = "../search" }
playback = { path = "../playback" }
ui = { path = "../ui" }
config = { package = "config", path = "../engine/crates/config" }
engine = { package = "audio-engine", path = "../engine" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
env_logger = "0.11"
log = "0.4"
dirs = "7.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"

# ── Windows: the native, exclusive-mode output backends ───────────────────────
# See `crates/ui/Cargo.toml` for the full rationale. The same Windows-only
# dependency entry is declared here so the *binary* — not just the UI library
# — is built with the native backends. Cargo unifies features across the
# dependency graph, so one declaration would technically be enough; both are
# present so that `cargo build -p shadowplayer --target x86_64-pc-windows-msvc`
# and `cargo test -p ui` each get the right feature set on their own.
[target.'cfg(target_os = "windows")'.dependencies]
engine = { package = "audio-engine", path = "../engine", features = ["wasapi-native", "asio-native"] }


[features]
# `cargo run -p shadowplayer --features eval-tools` enables the
# `SHADOWPLAYER_EVAL*` screenshot/automation hooks (see `ui`'s `eval-tools`).
eval-tools = ["ui/eval-tools"]

# Windows only: the resource compiler that embeds the application icon and the
# version metadata into the `.exe`. It is a *target-specific* build
# dependency, so Linux and macOS builds never compile it and never need a
# resource compiler.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
