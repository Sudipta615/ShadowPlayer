[package]
name = "ui"
version = "0.3.0"
edition = "2021"

[dependencies]
domain = { path = "../domain" }
audio-session = { path = "../audio-session" }
database = { path = "../database" }
metadata = { path = "../metadata" }
library = { path = "../library" }
lyrics = { path = "../lyrics" }
search = { path = "../search" }
playback = { path = "../playback" }
config = { package = "config", path = "../engine/crates/config" }
engine = { package = "audio-engine", path = "../engine" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
crossbeam = "0.8"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Native OS file/folder picker. Default features use the XDG Desktop Portal
# backend (no GTK3 dev libraries required on Linux).
rfd = "0.15"
# MPRIS2 desktop integration (Linux). zbus is already in the tree via `ashpd`.
zbus = "5"
