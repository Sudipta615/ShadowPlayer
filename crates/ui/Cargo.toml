[package]
name = "ui"
version = "0.24.0"
edition = "2021"
license = "Apache-2.0"


[build-dependencies]
serde_json = "1.0"

[dependencies]
domain = { path = "../domain" }
audio-session = { path = "../audio-session" }
database = { path = "../database" }
metadata = { path = "../metadata" }
library = { path = "../library" }
lyrics = { path = "../lyrics" }
search = { path = "../search" }
playback = { path = "../playback" }
media-tools = { path = "../media-tools" }
config = { package = "config", path = "../engine/crates/config" }
engine = { package = "audio-engine", path = "../engine", features = ["tag-write"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
crossbeam = "0.8"
dirs = "7.0"
# A random loopback-control token. Already in the tree through other crates.
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Native OS file/folder picker. Default features use the XDG Desktop Portal
# backend (no GTK3 dev libraries required on Linux).
rfd = "0.17"
# The crossfade preview opens its own short output stream, independent of the
# main engine, so the demo can play without interrupting the current track.
cpal = "0.18"
# Podcast subscriptions: a small XML pull parser and a TLS-capable HTTP client.
# Both are already in the dependency graph of the engine/tooling crates.
roxmltree = "0.20"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }

# ── Windows: the native, exclusive-mode output backends ───────────────────────
# On Windows, the app negotiates a *real* exclusive stream: WASAPI Exclusive
# (a genuine `IAudioClient` opened in `AUDCLNT_SHAREMODE_EXCLUSIVE`) and
# Steinberg ASIO (the `IASIO` COM interface, no C++ SDK). Without these
# features the Windows build is shared-mode only — it plays through the OS
# mixer and cannot be bit-perfect, which is the whole point of this player.
#
# The features are declared here, in a Windows-only dependency table, rather
# than as app-level features because Cargo cannot make a feature
# target-conditional. The engine gates the corresponding modules by target as
# well (`#[cfg(all(target_os = "windows", feature = "wasapi-native"))]`), so
# nothing Windows-only is compiled on Linux or macOS.
#
# Escape hatch: delete the two feature names below to fall back to shared-mode
# output on Windows. The Settings diagnostics card always reports which backend
# was actually negotiated, so the app never claims exclusivity it did not get.
[target.'cfg(target_os = "windows")'.dependencies]
engine = { package = "audio-engine", path = "../engine", features = ["tag-write", "wasapi-native", "asio-native"] }

# MPRIS2 desktop integration is Linux-only. Keeping zbus target-scoped means
# Windows/macOS builds do not try to compile a D-Bus stack they cannot use.
[target.'cfg(target_os = "linux")'.dependencies]
# zbus is already in the tree via `ashpd`.
zbus = "6"
# zbus 6 dropped its blocking API; the MPRIS worker drives the async calls on
# its own thread with this tiny executor.
pollster = "1.0"

# Windows System Media Transport Controls and macOS Now Playing. Linux keeps
# its native MPRIS2 backend above; souvlaki's Linux feature would pull a second
# D-Bus stack, so it is only compiled on the other desktop platforms.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
souvlaki = { version = "0.8", default-features = false }
raw-window-handle = "0.6"

[dev-dependencies]
# The library benchmark. `cargo bench -p ui` measures the rebuild of a
# 100,000-track library, which is the operation a big library makes the UI
# thread wait for.
criterion = "0.8.2"

[[bench]]
name = "library_100k"
harness = false

[features]
# Development-only automation hooks: `SHADOWPLAYER_EVAL*` drives the UI to a
# chosen state, takes a screenshot and exits. They are compiled out of release
# builds: a shipped player has no `process::exit` reachable from an environment
# variable, and ~500 lines of test scaffolding stay out of the binary.
eval-tools = []
