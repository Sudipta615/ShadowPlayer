[package]
name = "metadata"
version = "0.20.0"
edition = "2021"
license = "Apache-2.0"


[dependencies]
domain = { path = "../domain" }
engine = { package = "audio-engine", path = "../engine" }
log = "0.4"
thiserror = "2.0"
# Reads embedded lyrics. Symphonia's readers surface Vorbis comments but no
# ID3, so anything MP3/WAV/MP4 needs a real tag library. Same crate+version the
# engine already pulls in for tag write-back, so it costs no extra build.
lofty = "0.25"
