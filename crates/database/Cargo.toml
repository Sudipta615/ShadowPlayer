[package]
name = "database"
version = "0.27.1"
edition = "2021"
license = "Apache-2.0"


[dependencies]
domain = { path = "../domain" }
recommendation = { package = "shadow-recommender", path = "../recommendation" }
rusqlite = { version = "0.40", features = ["bundled", "bundled-full"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
thiserror = "2.0"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
