[package]
name = "media-tools"
version = "0.33.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
audio-session = { path = "../audio-session" }
domain = { path = "../domain" }
recommendation = { package = "shadow-recommender", path = "../recommendation" }
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }

[dev-dependencies]
