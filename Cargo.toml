[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/audio-session",
    "crates/database",
    "crates/metadata",
    "crates/lyrics",
    "crates/search",
    "crates/library",
    "crates/playback",
    "crates/recommendation",
    "crates/ui",
    "crates/app",
    "crates/clap-fixture-plugin",
    "crates/media-tools",
]
exclude = [
    "crates/engine",
    "crates/app/assets/rasterizer",
]

# ── Distribution ──────────────────────────────────────────────────────────────
# How the player is packaged and released.
#
# The release workflow (`.github/workflows/release.yml`) does **not** use
# cargo-dist. It builds the binary per target and then runs the packaging
# scripts in `scripts/` (`package-tarball.sh`, `package-deb.sh`,
# `package-appimage.sh`, `package-macos.sh`, `package-windows.sh`), which is
# what actually produces the `.deb`, AppImage, `.dmg` and Windows artefacts
# attached to a draft GitHub Release.
#
# This block used to declare a full cargo-dist configuration as well. Nothing
# read it: the workflow's only cargo-dist step was `cargo dist plan`, whose
# output was never consumed, so the two pipelines could drift apart while both
# looked authoritative. The dead configuration was removed rather than kept as
# a second, unenforced description of how a release is built. If cargo-dist is
# ever adopted, it replaces the `scripts/` path — it does not sit beside it.
#
# The engine is deliberately NOT distributed here. It is a separate,
# independently versioned workspace (`crates/engine`) consumed as a path
# dependency, and it ships its own artefacts under its own name — see
# `crates/engine/README.md`.

