[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
ignore = [
    # Transitive dependencies of accesskit / eframe that have not yet migrated
    # to zbus 6.0 wire format:
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # The Mozilla root-store data shipped by `webpki-roots` (via `ureq` in
    # media-tools and the UI). It is a permissive data licence, not a code
    # licence; CDLA-Permissive-2.0 grants the same rights for the certificate
    # bundle that MIT/Apache-2.0 grant for code.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
