name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  player:
    name: Player workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine links ALSA on Linux, and eframe/winit need the X11 and
      # Wayland client libraries even for a headless `cargo test`.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev dbus

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # Warnings are not allowed to accumulate: the audit that this CI encodes
      # found several bugs that a warning would have caught.
      - name: Clippy
        run: cargo clippy --workspace --bins --lib --all-targets -- -D warnings

      - name: Tests
        shell: bash
        run: |
          cargo test -p domain -p database -p metadata -p lyrics -p library \
            -p playback -p search -p audio-session -p ui --lib \
            -- --test-threads=1 2>&1 | tee test.log || {
            echo "::error title=Player Tests Failure::$(grep -E 'FAILED|failures:' -A 5 test.log || tail -n 15 test.log)"
            tail -n 60 test.log
            exit 1
          }

      # A real session bus, not a mock: the service registers its well-known
      # name and accepts the same PlayPause method playerctl calls.
      - name: MPRIS on a session bus
        run: >
          dbus-run-session -- cargo test -p ui --lib
          services::mpris_service::mpris_integration_tests::mpris_service_appears_on_the_session_bus_and_accepts_play_pause
          -- --exact

      # The installer inputs are files, so they can be checked even when the
      # runner cannot link a Windows or macOS release binary.
      - name: Cross-platform packaging inputs
        run: cargo test -p shadowplayer --test platform_parity -- --test-threads=1

      # A 100,000-track library has to stay inside the published budgets
      # (docs/PERFORMANCE.md). The measurement is a release build: the
      # budgets are about the shipped player, not about a debug build's
      # unoptimised arithmetic.
      - name: The library budget
        run: >
          cargo test --release -p ui --test library_budget
          -- --nocapture --test-threads=1

      # The benchmark must compile, or `cargo bench -p ui` is broken for
      # everyone.
      - name: The library benchmark compiles
        run: cargo bench -p ui --bench library_100k --no-run

      # The version bump is a scripted, repeated chore, so it is guarded by a
      # test rather than by remembering to do eleven edits at once.
      - name: Versions are in lockstep
        run: cargo test -p shadowplayer --test version_lockstep -- --test-threads=1

  engine:
    name: Engine workspace (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/engine
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/engine

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        shell: bash
        run: |
          cargo test 2>&1 | tee test.log || {
            echo "::error title=Engine Tests Failure::$(grep -E 'FAILED|failures:' -A 5 test.log || tail -n 15 test.log)"
            tail -n 60 test.log
            exit 1
          }

      # The optional features are compiled on every push, so a feature-gated
      # module cannot rot behind the default set.
      - name: All-features build
        run: cargo check --all-features --all-targets

      # The benchmark suite must compile, or `cargo bench` is broken for
      # everyone.
      - name: Benchmarks compile
        run: cargo bench --no-run

      # The engine's own documentation is a published surface: `cargo doc`
      # is how an embedder reads the contracts.
      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      # The engine's optional MPRIS interface uses zbus directly; compile it
      # so it cannot rot behind the default feature set.
      - name: MPRIS feature check
        run: cargo check --features mpris

      # The player workspace enables tag-write, but it is not in the engine's
      # default features. Build and run the tag write-back tests explicitly.
      - name: Tag write-back tests
        run: cargo test --features tag-write decode::tags

  desktop-targets:
    name: ${{ matrix.name }} compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev dbus

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Native target check: this is where the platform implementations actually compile.
      #
      # A release must be buildable, so this is a *release* build, not a
      # `cargo check`.
      - name: Compile desktop player
        run: cargo build --release -p shadowplayer --target ${{ matrix.target }}

      # The test binaries must compile on all platforms too, or the
      # cross-platform test job below has nothing to run.
      - name: Compile the tests
        run: cargo test --no-run -p shadowplayer --target ${{ matrix.target }}

  engine-tests-cross:
    name: Engine tests on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/engine

      # The engine's suites are cross-platform tested here.
      - name: Engine tests
        shell: bash
        run: |
          cargo test 2>&1 | tee test.log || {
            echo "::error title=Cross Engine Tests Failure::$(grep -E 'FAILED|failures:' -A 5 test.log || tail -n 15 test.log)"
            tail -n 60 test.log
            exit 1
          }

  wayland-smoke:
    name: Wayland GUI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev \
            weston libegl1 libgles2 libgl1-mesa-dri dbus

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the release player
        run: cargo build --release -p shadowplayer

      # The golden-screenshot harness is not in this tree yet. This job covers
      # the half that is implementable today: the real binary starts, maps a
      # window through Wayland (with no XWayland), and stays alive.
      - name: Run on a headless Wayland compositor
        run: bash scripts/wayland-smoke.sh target/release/shadowplayer

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: crates/engine
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: taiki-e/install-action@cargo-fuzz

      # Ten minutes per target is enough to find a crash in a parser.
      - name: Fuzz the decoders
        run: cargo fuzz run decode_fuzz -- -max_total_time=600
        working-directory: crates/engine/fuzz

      - name: Fuzz the playlist parsers
        run: cargo fuzz run playlist_fuzz -- -max_total_time=600
        working-directory: crates/engine/fuzz

      - name: Fuzz the lyrics parser
        run: cargo fuzz run lyrics_fuzz -- -max_total_time=600
        working-directory: crates/engine/fuzz

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: crates/engine
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/engine

      # The committed baselines are the reference; a regression beyond the
      # threshold fails the job, so a slow change cannot land unnoticed.
      - name: Compare against the baselines
        run: cargo bench -- --save-baseline ci

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: crates/engine/target/criterion

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Every dependency is a stranger's code, and this player runs with the
      # user's audio.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  docs:
    name: Documentation truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The READMEs make claims. This job checks the ones a test can check:
      # the shortcut table, the test counts, the version badges, the platform
      # matrix.
      - name: The documentation matches the code
        run: cargo test -p shadowplayer --test docs_truth -- --test-threads=1
