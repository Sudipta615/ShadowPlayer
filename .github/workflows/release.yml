name: Release

# A release is cut by pushing an annotated tag (`v0.11.0`, …). The tag's
# version must equal the workspace version — `crates/app/tests/version_lockstep.rs`
# fails the build otherwise, so a mistyped tag cannot produce a release whose
# name lies about what is inside it.
#
# The artefacts are attached to a DRAFT release first. The maintainer reads the
# release notes, checks the checksums, and publishes it. Nothing is announced
# by a machine that has not looked at it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build (e.g. v0.11.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan the build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # The workspace version must match the tag. This is the same rule
          # `version_lockstep.rs` enforces in CI; repeating it here means a
          # mistyped tag fails with a sentence rather than a diff.
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/app/Cargo.toml | head -1)"
          expected="v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::The tag '$tag' does not match the workspace version '$version' (expected '$expected')."
            exit 1
          fi
          echo "Building $tag from workspace version $version."

      # There is no cargo-dist step here on purpose. The artefacts are built by
      # the `build` job below and packaged by the `scripts/package-*.sh` suite;
      # a `cargo dist plan` step used to run here and its output was never read
      # by anything, which made two packaging descriptions look authoritative
      # at once. See the distribution note in the root `Cargo.toml`.

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc }
          - { os: windows-latest,  target: aarch64-pc-windows-msvc }
          - { os: macos-latest,    target: x86_64-apple-darwin }
          - { os: macos-latest,    target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the distributable binary
        run: cargo build --release -p shadowplayer --target ${{ matrix.target }}

      - name: Package native artefacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/distrib
          scripts/package-tarball.sh target/${{ matrix.target }}/release/shadowplayer ${{ matrix.target }} target/distrib
          if command -v dpkg-deb >/dev/null 2>&1; then
            scripts/package-deb.sh target/${{ matrix.target }}/release/shadowplayer ${{ matrix.target }} target/distrib
          fi
          scripts/package-appimage.sh target/${{ matrix.target }}/release/shadowplayer ${{ matrix.target }} target/distrib

      - name: Package native artefacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/distrib
          scripts/package-macos.sh target/${{ matrix.target }}/release/shadowplayer ${{ matrix.target }} target/distrib

      - name: Package native artefacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p target/distrib
          scripts/package-windows.sh target/${{ matrix.target }}/release/shadowplayer.exe ${{ matrix.target }} target/distrib

      - name: Collect the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/distrib/
          if-no-files-found: error

  publish:
    name: Publish the draft release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the artefacts
        uses: actions/download-artifact@v4
        with:
          path: target/distrib
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: target/distrib
        run: |
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --title "ShadowPlayer $TAG" \
            --generate-notes \
            target/distrib/*

      - name: Report the checksums
        run: |
          echo "### Release Artefacts & Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Checksum | File |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          (cd target/distrib && sha256sum * 2>/dev/null || shasum -a 256 * 2>/dev/null) \
            | awk '{print "| `" $1 "` | `" $2 "` |"}' >> "$GITHUB_STEP_SUMMARY"
