version: 2

# Three Cargo workspaces (player, engine, fuzz) plus the actions used by the
# release pipeline. Minor and patch updates are grouped so a week's routine
# bumps arrive as one reviewable PR per workspace; major updates stay separate
# because they need a migration decision.

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      player-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/crates/engine"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      engine-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/crates/engine/fuzz"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
